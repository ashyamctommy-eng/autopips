# Autopipsz — autopips.pro reverse proxy (nginx)
#
# Install:
#   sudo cp deploy/nginx/autopips.pro.conf /etc/nginx/conf.d/autopips.pro.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is included from the `http {}` context (conf.d/*.conf), which is
# what lets it declare `map` / `upstream` blocks. Do not include it from inside
# another `server {}` block. If your nginx has no conf.d include, replace the
# apex domain in the filenames above with a name ending in `.conf` and add
# `include /path/to/autopips.pro.conf;` inside `http {}`.
#
# ── TLS CERTIFICATES (ACME / Let's Encrypt) ─────────────────────────────────
# The paths below are the ones certbot produces. Either method works:
#
#   webroot (what the HTTP server block below is already set up for):
#     sudo mkdir -p /var/www/certbot
#     sudo certbot certonly --webroot -w /var/www/certbot \
#          -d autopips.pro -d www.autopips.pro \
#          --email ops@autopips.pro --agree-tos --no-eff-email
#
#   standalone (only if nothing else listens on port 80):
#     sudo certbot certonly --standalone -d autopips.pro -d www.autopips.pro
#
#   Renewal: `certbot renew` installs a systemd timer / cron job by default.
#   Add a reload hook so nginx picks up the renewed certificate:
#     echo 'systemctl reload nginx' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh
#     sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh
#   Certificate lives in /etc/letsencrypt/live/autopips.pro/ and is readable by
#   root; if nginx runs as a non-root worker it needs read access to the
#   `archive/`+`live/` directories (or use a copy/deploy hook).
#
# ── DNS ─────────────────────────────────────────────────────────────────────
#   A     autopips.pro      → <server IPv4>
#   AAAA  autopips.pro      → <server IPv6>   (only if IPv6 is configured)
#   CNAME www.autopips.pro  → autopips.pro
#   Point the record at the proxy host and make sure port 80 is reachable for
#   the ACME HTTP-01 challenge.
#
# ── WHY /ws/ IS PROXIED TO THE WORKER ───────────────────────────────────────
#   `src/lib/socket-client.ts` connects to the namespace `/ws/trading` with
#   engine.io path `/ws/socket.io`. When `NEXT_PUBLIC_WS_URL` is unset (the
#   normal, recommended deployment) the browser resolves that path against the
#   PAGE ORIGIN — https://autopips.pro — so something must terminate the
#   Socket.IO HTTP + WebSocket traffic on this hostname and forward it to the
#   standalone runtime (`npm run start:ws`, WS_PORT=4001).
#
#   A Next.js rewrite cannot do this job: the socket server lives in a different
#   Node process (`src/server/main.ts`) and the WebSocket upgrade is an HTTP
#   protocol switch that Next.js route handlers do not carry. Only the proxy can.
#
#   The client starts with the `polling` transport and then upgrades to a real
#   WebSocket, so BOTH must work:
#     * the polling transport is a chain of GET/POST requests to
#       /ws/socket.io/?EIO=4&transport=polling — needs proxy_buffering off so the
#       long-poll responses are not held back;
#     * the upgrade needs `proxy_http_version 1.1` + `Upgrade`/`Connection`
#       headers, otherwise the handshake 400s and the client stays on polling.
#   Long `proxy_read_timeout`/`proxy_send_timeout` keep an idle socket alive
#   (the runtime only sends events when the market or a trade moves).

# ────────────────────────────── upgrade mapping ─────────────────────────────
# "upgrade" when the client asked for an upgrade, "close" otherwise. Using a map
# (rather than a hardcoded `Connection: upgrade`) keeps ordinary HTTP/1.1
# requests on this connection reusable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ──────────────────────────────── upstreams ─────────────────────────────────
# docker-compose publishes both services on the loopback interface only.
upstream autopips_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream autopips_ws {
    server 127.0.0.1:4001;
    keepalive 8;
}

# ───────────────────────── port 80: ACME + redirect ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name autopips.pro www.autopips.pro;

    # Let's Encrypt HTTP-01 challenge must be answered over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else is HTTPS-only.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────── port 443: the real site ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1. On older builds use
                                   # `listen 443 ssl http2;` above instead.
    server_name autopips.pro www.autopips.pro;

    server_tokens off;

    # ── certificate (see the header comment for how to obtain it) ──
    ssl_certificate           /etc/letsencrypt/live/autopips.pro/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/autopips.pro/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/autopips.pro/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (needs a working resolver).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── request body ────────────────────────────────────────────────────────
    # The KYC upload endpoint (POST /api/v1/kyc/upload) accepts one document per
    # part up to KYC_MAX_DOCUMENT_BYTES = 10 MB (src/server/modules/kyc/storage.service.ts),
    # and a submission can carry four parts (idFront, idBack, proofOfAddress,
    # selfie). 12m leaves headroom for multipart framing so nginx is never the
    # thing that rejects a legitimate passport scan with a 413.
    client_max_body_size 12m;
    client_body_timeout  60s;

    # ── compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli is preferred when the ngx_brotli module is compiled in. Alpine and
    # Debian default nginx packages do NOT include it, and `brotli on;` is a
    # hard config error without the module (`nginx -t` fails, nginx refuses to
    # start), so it is left off by default. If your build has ngx_brotli, enable
    # the block below — leaving gzip on as the fallback.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_types application/javascript application/json image/svg+xml text/css text/javascript text/plain;

    # ── security headers ────────────────────────────────────────────────────
    # Kept consistent with `next.config.mjs` (X-Frame-Options, nosniff,
    # Referrer-Policy, Permissions-Policy, HSTS). Next.js already sends these on
    # application responses; repeating them here also covers responses nginx
    # generates itself (400/413/502/504, ACME challenge hits), which never reach
    # Next.js. Duplicate identical headers are harmless — if a future proxy
    # manager rejects them, add `proxy_hide_header <name>;` in the locations
    # below before re-adding.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=()" always;

    # ── internal-only: the socket runtime's publish endpoint ───────────────
    # POST /internal/publish on the worker broadcasts into every connected
    # socket client (Bearer WS_INTERNAL_TOKEN). The Next.js app does not use it
    # (it publishes over the Redis channel autopips:ws:events); it is an
    # operator/integration hook and must never be reachable from the internet.
    # Answer 404 (not 403) so the path is not even confirmed to exist.
    location = /internal/publish {
        return 404;
    }

    # ── the live trading channel ────────────────────────────────────────────
    # /ws/socket.io/** (engine.io path used by src/lib/socket-client.ts).
    location /ws/ {
        proxy_pass http://autopips_ws;

        # WebSocket upgrade — the whole reason this location exists.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep an idle socket open. The runtime pushes only when the market or a
        # trade moves; a 60s default read timeout would kill quiet sessions.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # Long-poll (transport=polling) responses must not be buffered.
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Compressing a protocol upgrade is pointless and can confuse the
        # framing; keep the socket path raw.
        gzip off;
    }

    # Socket.IO's default engine.io path, in case a client (or a future
    # WS_SOCKET_PATH override) uses it. Same rules as /ws/.
    location /socket.io/ {
        proxy_pass http://autopips_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        gzip off;
    }

    # ── API ─────────────────────────────────────────────────────────────────
    # Includes the NOWPayments IPN webhook:
    #   POST https://autopips.pro/api/v1/payments/nowpayments/ipn
    #
    # ── DO NOT TOUCH THE BODY OR THE SIGNATURE HEADER ───────────────────────
    # The IPN route authenticates the CALLBACK ITSELF: the raw request text is
    # hashed with HMAC-SHA512 keyed by NOWPAYMENTS_IPN_SECRET and compared,
    # timing-safely, with the `x-nowpayments-sig` request header
    # (`src/server/modules/payments/ipn.service.ts`). The digest is over the
    # exact bytes NOWPayments sent.
    #   * Any body rewriting — `sub_filter`, a JSON re-serialiser, a compression
    #     module that alters the stream, request tampering middleware — changes
    #     the bytes, so the digest no longer matches and EVERY genuine callback is
    #     rejected with 401 and no deposit is ever credited.
    #   * Any header scrubbing/renaming (`proxy_set_header x-nowpayments-sig ""`
    #     or a hop-by-hop filter that drops it) fails closed the same way.
    # nginx forwards all request headers verbatim by default; the explicit
    # pass-through below documents the requirement. It is a no-op when the header
    # is absent (a variable that evaluates to an empty string is not sent), so
    # non-IPN API requests are unaffected.
    # DO NOT add `proxy_request_buffering off;` here either: buffering is fine
    # (nginx forwards the buffered bytes unchanged), whereas a streamed body that
    # is not fully read would break the route's body-size guard.
    location /api/ {
        proxy_pass http://autopips_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # Pass the NOWPayments HMAC signature through unmodified.
        proxy_set_header X-Nowpayments-Sig $http_x_nowpayments_sig;

        # Belt and braces: make sure no module can rewrite the payload.
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout    75s;
        proxy_send_timeout    75s;
        proxy_connect_timeout 10s;
    }

    # ── Next.js immutable build assets ──────────────────────────────────────
    # NOTE: a location that declares its own `add_header` loses the inherited
    # server-level headers, so the security set is repeated here.
    location /_next/static/ {
        proxy_pass http://autopips_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=()" always;
    }

    # ── everything else: the Next.js app ────────────────────────────────────
    location / {
        proxy_pass http://autopips_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout    75s;
        proxy_send_timeout    75s;
        proxy_connect_timeout 10s;
    }
}
