kind = "mobile"
previewPath = "/autopips-mobile/"
title = "Autopipsz Mobile"
description = "Native read-only companion for Autopipsz clients to securely check account balances, positions and account activity."
version = "1.0.0"
id = "artifacts/autopips-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/autopips-mobile/" ]
localPort = 20360

[services.development]
run = "pnpm --filter @workspace/autopips-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autopips-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/autopips-mobile", "run", "serve" ]

[services.env]
PORT = "20360"
BASE_PATH = "/autopips-mobile/"
