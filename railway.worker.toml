# ─────────────────────────────────────────────────────────────────────────────
# Railway service config — WORKER (Socket.IO realtime + bot runtime)
#
# Point the *worker* service at this file:
#   Railway → service → Settings → Config-as-code → Config File Path
#   = /railway.worker.toml
#   (and make sure the build uses Dockerfile.worker — set below)
#
# ⚠️ RUN EXACTLY ONE REPLICA.
# `src/server/modules/bot/bot.runtime.ts` takes a Redis lock
# (`autopips:lock:bot-runtime`) so that only one process ever trades. Extra
# replicas will start, serve sockets, but refuse to start the bot — so scaling
# this service out does not double-trade, it just wastes a container and splits
# the socket rooms. Keep `numReplicas = 1` unless you first split the socket and
# bot concerns into separate services.
# ─────────────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
# `npm run start:ws` → tsx src/server/main.ts. The process reads the platform's
# `PORT` first and falls back to WS_PORT, so it binds to whatever Railway routes.
#
# `npm run start:ws` also triggers `prestart:ws`
# (`node scripts/worker-preflight.mjs`), which aborts with an actionable message
# if this service was built from the wrong Dockerfile — the shape of the
# 2026-09-27 failure, where the deploy died on
# `ERR_MODULE_NOT_FOUND: /app/src/server/main.ts` because the image was the WEB
# image (no src/, and tsx pruned) rather than this one. Keep this file the ONLY
# place the worker's start command is defined, and do not override it in the
# Railway UI: a UI start command wins over this file and bypasses the guard.
startCommand = "npm run start:ws"

# `/healthz` probes Postgres AND Redis for real and answers 503 when either is
# down, so an unhealthy worker is reported rather than silently serving nothing.
healthcheckPath = "/healthz"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# One replica, always. See the warning above.
numReplicas = 1
